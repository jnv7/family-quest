name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Layer check
        run: npm run lint:imports

      - name: Theme leak lint
        run: npm run lint:theme-leak

      - name: Theme validation
        run: npm run validate-theme

      - name: Credits up to date
        run: npm run credits -- --check

      - name: Unit tests
        run: npm test

      # The Firestore emulator needs Java; only CI provides it (CONTRIBUTING.md).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Firestore rules tests
        run: npm run test:rules 2>&1 | tee rules.log; exit ${PIPESTATUS[0]}

      # The same contract suite as the memory adapter, against the Firestore and Auth emulators.
      - name: Firestore adapter tests
        run: npm run test:emulator 2>&1 | tee emulator.log; exit ${PIPESTATUS[0]}

      # Surfaces emulator start-up errors (such as a rules syntax error) as annotations.
      - name: Report emulator failures
        if: failure()
        run: grep -ihE "error|fail" rules.log emulator.log | head -30 | sed 's/^/::error::/' || true

  # Publishes the build to GitHub Pages. The product owner allows `main` and
  # `release/*` in Settings → Environments → github-pages.
  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
